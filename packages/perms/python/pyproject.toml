[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iamyakay-perms"
version = "0.1.0"
description = "discord permission math and why was this denied explanations"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["discord", "permissions", "bot"]
authors = [
  { name = "iamyakay" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/iamyakay/discord-kit"
Repository = "https://github.com/iamyakay/discord-kit"
Issues = "https://github.com/iamyakay/discord-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/iamyakay_perms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
